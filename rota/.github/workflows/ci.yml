name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'rota/.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: rota

      - name: Typecheck
        run: pnpm typecheck
        working-directory: rota

      - name: Lint
        run: pnpm lint
        working-directory: rota

      - name: Run tests
        run: pnpm test
        working-directory: rota
